# RWA Arbitrage Bot Configuration

mode: "PAPER"  # PAPER or LIVE

# 대상 상품
# NOTE: perp_ticker는 Hyperliquid API universe의 실제 name 필드값 사용
#       (dex:"xyz" 조회 시 "xyz:" 프리픽스 포함)
products:
  wti:
    perp_ticker: "xyz:CL"       # trade.xyz WTI 퍼프 (API name)
    futures_symbol: "MCL"       # CME Micro WTI (100배럴/계약)
    contract_size: 100           # 1 MCL = 100배럴 = perp 100단위
    min_order_size: 1
    futures_fee_per_contract: 2.50  # MCL 편도 수수료 (거래소+브로커)

# KIS 종목코드 매핑 (settings에서 관리, API키는 secrets.yaml)
# NOTE: kis_symbol은 KIS 종목코드 (근월물, 매월 롤오버 필요)
kis_symbol_map:
  wti: "MCLM26"              # MCL 2026년 6월물 (프론트 월물, effective 2026-04-14 roll 완료 후)
  # NOTE: trade.xyz oracle는 CME 프론트 월물 기반
  #   매월 5~10번째 영업일: 근월물→차월물 가중평균 롤오버
  #   MCLM26(6월물) 만기: 2026-05-20경
  #   다음 롤오버 window: 2026-05-07 ~ 2026-05-14 (5월 5~10 영업일)
  #   P1 자동 롤오버: src/strategy/rollover.py 의 get_active_contract()가 계산
  #     매시간 watch loop가 desired != current 감지 시 resubscribe

# Hyperliquid 설정
hyperliquid:
  use_testnet: false             # trade.xyz HIP-3 퍼프는 메인넷에만 존재
  perp_dex: "xyz"                # trade.xyz의 HIP-3 perp DEX 이름
  ws_reconnect_delay: 5         # 초
  ws_ping_interval: 30          # 초

# 키움증권 설정 (KIS 미활성 시 mock으로 동작)
kiwoom:
  use_mock: true                # 모의투자 모드
  server_type: "mock"           # mock 또는 real

# KIS (한국투자증권) 설정
kis:
  enabled: true                # 실제 CME 호가 수신 활성화
  is_paper: false              # 실투자 서버
  cme_realtime: true           # CME/NYMEX 유료시세 신청 완료

# 전략 파라미터 (2026-04-02 M7: 스프레드 수렴 기반 청산)
# 원리: perp는 futures(인덱스) 가격으로 수렴해야 함. 수렴까지 펀딩 수취하며 대기.
strategy:
  # 베이시스 계산 (진입 시그널용)
  basis_window_hours: 24        # 24h window → mean/std 안정화
  basis_std_multiplier: 3.0     # 3σ = 극단값에서만 진입

  # 진입
  entry_threshold_bps: 20       # exec basis가 이 값 이상 벌어져야 진입 (수수료 ~13bp + 슬리피지 버퍼)
  min_abs_entry_bps: 10         # 절대값 floor: |exec_basis| 이 값 미만이면 진입 차단 (통계신호와 무관)
                                # (post-rollover 30건 분석: <10bp는 14% WR -$202, 10bp+는 94% WR +$199)

  # 청산 — 스프레드 수렴 기반
  convergence_target_bps: 3     # spread ≤ 3bp면 수렴 완료 → 청산
  max_hold_hours: 48            # 수렴 대기 + 펀딩 수취 (최대 48시간)
  # emergency_close_threshold은 risk 섹션에서 관리

  # 펀딩레이트
  funding_rate_weight: 1.0      # 펀딩 수익 반영 비율
  min_funding_advantage_bps: 2  # 최소 펀딩 유리 조건

  # CME 장 시간 가드 (M9 대비 보수적 엔트리/엑싯)
  cme_closed_skip_entry: true       # CME 폐장 중엔 신규 진입 차단 (futures leg 체결 불가)
  pre_close_flatten_minutes: 30     # 마감 30분 전부터 진입 차단 + 보유 포지션 flatten
  flatten_threshold_hours: 4.0      # 다가오는 휴장이 이 시간 이상(주말/휴일)이면 flatten 발동
                                     # Mon-Thu 16:00-17:00 CT 일일 1h break는 threshold 미달 → 보유 유지

# 리스크 관리
risk:
  max_position_usd: 50000       # 최대 포지션 (USD)
  max_position_contracts: 2     # 최대 CME 계약 수
  max_margin_usage_pct: 50      # 최대 마진 사용률 (%)
  max_slippage_bps: 5           # 최대 슬리피지 (bp), 좁은 스프레드 환경
  max_daily_loss_usd: 1000      # 일일 최대 손실 (보수적)
  emergency_close_threshold: 40  # 긴급 청산 베이시스 (bp), 관측 최대 ~45bp

  # 롤오버
  rollover_start_day: 5         # 롤오버 시작 영업일
  rollover_end_day: 10          # 롤오버 종료 영업일
  rollover_position_reduce_pct: 50  # 롤 기간 포지션 축소율 (%)

  # Phase 11d — LIVE 모드 안전장치
  # 페어별 hard cap (계약수). LIVE 모드에서만 적용 (PAPER는 무시).
  # 첫 실거래는 1 MCL부터 시작. 안정화 후 상향.
  live_max_contracts_per_pair:
    wti_cme_hl: 1
  ws_stale_seconds: 60.0        # leg quote 60s 이상 stale → 알림 + auto-flatten
  ws_stale_auto_flatten: true   # true면 stale 감지 시 모든 오픈 포지션 즉시 청산

# 데이터 저장
database:
  type: "sqlite"
  path: "data/arbitrage.db"

# Lighter (Phase D — Web3-Web3 첫 페어)
lighter:
  enabled: false                # main.py가 어댑터 wire 여부. shadow 시작 시 true로 flip.
  base_url: "https://mainnet.zklighter.elliot.ai"
  ws_url: "wss://mainnet.zklighter.elliot.ai/stream"

# Binance USDⓈ-M Futures (Phase E)
# 인증 불필요 — 페이퍼 shadow는 public REST/WS만 사용. live(Phase I)에서 HMAC 키 추가.
binance:
  enabled: false
  rest_url: "https://fapi.binance.com"
  ws_url: "wss://fstream.binance.com/ws"

# Bybit v5 linear (Phase F)
# 페이퍼 shadow는 public REST/WS. live는 Phase I에서 HMAC v5 키 추가.
bybit:
  enabled: false
  rest_url: "https://api.bybit.com"
  ws_url: "wss://stream.bybit.com/v5/public/linear"

# OKX v5 SWAP (Phase G)
# 페이퍼 shadow는 public REST/WS. live는 Phase I에서 3-header 인증
# (OK-ACCESS-KEY, OK-ACCESS-SIGN, OK-ACCESS-PASSPHRASE) + HMAC-SHA256.
okx:
  enabled: false
  rest_url: "https://www.okx.com"
  ws_url: "wss://ws.okx.com:8443/ws/v5/public"

# 명시 페어 — Web2-Web3 페어(wti_cme_hl)는 products+kis_symbol_map에서 자동 합성.
# 아래는 Web3-Web3 페어 추가용. Phase D에서 wti_hl_lighter shadow로 시작.
pairs:
  - id: wti_hl_lighter
    enabled: false              # shadow → 24h 분포 분석 후 true flip
    strategy: basis_convergence
    gate: cme_hours             # Strict: CME 휴장 시 OFF (펀딩 비대칭 위험 회피)
    leg_a:
      exchange: hyperliquid
      symbol: "xyz:CL"
      role: perp
      taker_fee_bps: 0.9
      funding_interval_hours: 1.0
      margin_asset: USDC
    leg_b:
      exchange: lighter
      symbol: "WTI"
      role: perp
      taker_fee_bps: 0.0        # Lighter taker fee 실측 후 갱신
      funding_interval_hours: 1.0
      margin_asset: USDC
    params:
      entry_threshold_bps: 12   # Web3-Web3 페어는 CME 페어보다 좁은 임계 (수수료 적음)
      convergence_target_bps: 3
      max_hold_hours: 12        # 단기 hold (펀딩 누적 위험 최소화)

  - id: wti_hl_binance
    enabled: false              # Phase E shadow → 24h 분포 분석 후 true flip
    strategy: basis_convergence
    gate: cme_hours
    leg_a:
      exchange: hyperliquid
      symbol: "xyz:CL"
      role: perp
      taker_fee_bps: 0.9
      funding_interval_hours: 1.0
      margin_asset: USDC
    leg_b:
      exchange: binance
      symbol: "CLUSDT"          # Binance USDⓈ-M Futures (2026-04-01 런칭, 100x)
      role: perp
      taker_fee_bps: 4.0        # Binance USD-M taker default ~0.04% (실측 후 보정)
      funding_interval_hours: 4.0
      margin_asset: USDT
    params:
      entry_threshold_bps: 15   # 1h vs 4h 펀딩 비대칭 + USDC/USDT peg 버퍼
      convergence_target_bps: 3
      max_hold_hours: 12

  - id: wti_hl_bybit
    enabled: false              # Phase F shadow → 24h 분포 분석 후 true flip
    strategy: basis_convergence
    gate: cme_hours
    leg_a:
      exchange: hyperliquid
      symbol: "xyz:CL"
      role: perp
      taker_fee_bps: 0.9
      funding_interval_hours: 1.0
      margin_asset: USDC
    leg_b:
      exchange: bybit
      symbol: "CLUSDT"          # Bybit linear perp (2026-03-27 런칭, 50x)
      role: perp
      taker_fee_bps: 5.5        # Bybit USDT perp taker ~0.055% (실측 후 보정)
      funding_interval_hours: 4.0
      margin_asset: USDT
    params:
      entry_threshold_bps: 15   # Binance와 동일 (4h funding asymmetry 같음)
      convergence_target_bps: 3
      max_hold_hours: 12

  - id: wti_hl_okx
    enabled: false              # Phase G shadow → 24h 분포 분석 후 true flip
    strategy: basis_convergence
    gate: cme_hours
    leg_a:
      exchange: hyperliquid
      symbol: "xyz:CL"
      role: perp
      taker_fee_bps: 0.9
      funding_interval_hours: 1.0
      margin_asset: USDC
    leg_b:
      exchange: okx
      symbol: "CL-USDT-SWAP"    # OKX v5 swap, 4h funding (사용자 정정 2026-04-21)
      role: perp
      taker_fee_bps: 5.0        # OKX USDT swap taker ~0.05% (실측 후 보정)
      funding_interval_hours: 4.0
      margin_asset: USDT
    params:
      entry_threshold_bps: 15   # 4h funding asymmetry, USDC/USDT peg 버퍼
      convergence_target_bps: 3
      max_hold_hours: 12

# 알림 (Phase 11d) — bot_token / chat_id는 secrets.yaml에서 로드
telegram:
  enabled: true                 # token/chat_id 비어있으면 자동 비활성화

# 로깅
logging:
  level: "INFO"
  file: "logs/arbitrage.log"
  max_size_mb: 100
  backup_count: 5
